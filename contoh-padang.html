<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a1c2c">
<title>Math Quest — Contoh Padang Hitung</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/skin-kenney.css">
<style>
  /* Halaman contoh grafik baru: Padang Hitung dengan 5 titik */
  #scr-contoh { height: 100vh; height: 100dvh; }
  .dots { display: flex; gap: 4px; align-items: center; justify-content: center; margin-top: 4px; }
  .dot5 { width: 26px; height: 26px; display: grid; place-items: center; font-size: 13px; font-weight: 900; border: 2px solid #1a1c2c; background: #566c86; color: #fff; }
  .dot5.done { background: #ffcd75; color: #1a1c2c; }
  .dot5.now { background: #38b764; animation: bob 1s steps(1) infinite; }
  .dotLine { width: 10px; height: 3px; background: #1a1c2c; }
  #question.walking #qText { font-size: 22px; }
  #answers.walking .ans { visibility: hidden; }
  #mTop[hidden] { display: none !important; }
  #scr-contoh #arena { flex: none; height: max(220px, calc(100dvh - 530px)); }
  #scr-contoh #stage, #scr-contoh #mTop { z-index: 2; }
</style>
</head>
<body class="skinK">
<main id="app">
  <section id="scr-contoh" class="screen on">
    <header class="panel hud">
      <div class="row"><a class="back" href="./" style="text-decoration:none;display:inline-flex;align-items:center">◀ Game</a><b class="fieldName">🌼 Padang Hitung</b><span id="lvl">LV 3</span></div>
      <div class="row"><span class="hpIcon">❤️</span><div class="bar heroHp"><div id="heroHpFill"></div><span id="heroHpText"></span></div></div>
      <div id="dots" class="dots"></div>
    </header>
    <section id="arena">
      <canvas id="scene"></canvas>
      <div id="mTop" class="panel" hidden><div id="mName"></div><div class="bar"><div id="hpFill"></div><span id="hpText"></span></div>
        <div class="atkBar"><span>⚡</span><div class="atkTrack"><div id="atkFill"></div></div></div></div>
      <div id="fx"></div>
    </section>
    <div id="question" class="panel">
      <div class="fastBar"><span>⚡</span><div class="fastTrack"><div id="fastFill"></div></div></div>
      <div id="qView" hidden></div>
      <div class="qLine"><span id="qText">Ayo berangkat!</span><button id="btnSpeak" class="speak" aria-label="Bacakan soal">🔊</button></div>
    </div>
    <div id="answers"></div>
  </section>
</main>

<div id="overlay" hidden><div class="card panel">
  <div id="ovIcon"></div><h2 id="ovTitle"></h2><p id="ovText"></p>
  <div class="ovBtns"><button id="ovBtn">Oke</button><button id="ovBtn2" class="alt" hidden></button></div>
</div></div>

<script src="js/questions.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/visuals.js"></script>
<script src="js/balance.js"></script>
<script src="js/pixelart.js"></script>
<script src="js/contoh-padang.js"></script>
</body>
</html>
